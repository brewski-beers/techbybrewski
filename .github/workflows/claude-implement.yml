name: Claude Implement

# Issue-driven implementer. Add the `agent` label to an issue and Claude opens a
# DRAFT PR that closes it. Auth is keyless via workload identity federation
# (BrewCortex docs/autonomous-workforce.md) — no ANTHROPIC_API_KEY secret.
# `github_token` is NOT passed so the action authenticates as the Claude GitHub
# App, whose pushes trigger ci.yml.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to implement
        required: true

concurrency:
  group: claude-implement-${{ github.event.issue.number || github.event.inputs.issue }}
  cancel-in-progress: false

jobs:
  # Skip when the issue already has a PR — avoids a duplicate implement run when
  # KB (or /work-parallel) is working the same issue by hand. Mirrors the
  # "already has an open linked PR" filter in /work-parallel Step 1.
  #
  # Also skip while any `Depends on: #N` reference in the issue body is still
  # open — stops a freshly-labelled non-root issue from building against a stale
  # main. workflow_dispatch overrides both guards.
  dedup:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'agent'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check for an existing PR or unmet dependency
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number || github.event.inputs.issue }}
        run: |
          set -euo pipefail
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"

          branch_hit=$(gh pr list --state open --json headRefName \
            --jq "[.[] | select(.headRefName | test(\"^worker/${ISSUE}-\"))] | length")
          body_hit=$(gh pr list --state all --limit 50 --json state,body \
            --jq "[.[] | select(.state == \"OPEN\" or .state == \"MERGED\")
                       | select(.body | test(\"(?i)(clos|fix|resolv)e[sd]? #${ISSUE}\\\\b\"))] | length")
          if [ "${branch_hit:-0}" -gt 0 ] || [ "${body_hit:-0}" -gt 0 ]; then
            echo "Issue #${ISSUE} already has a linked PR (branch:${branch_hit} body:${body_hit}) — skipping implement."
            echo "#${ISSUE} already has a linked PR — skipping implement." >> "$summary"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manual runs proceed regardless — mirrors the dispatch carve-out in the
          # job-level `if` above.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch — dependency guard bypassed."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          body=$(gh issue view "${ISSUE}" --json body --jq '.body // ""')
          # Every `#N` on a line beginning with `Depends on:` (case-insensitive),
          # optionally wrapped in markdown bold (`**Depends on:**`, the format
          # /plan and /po actually write into issue bodies in this repo).
          # Handles a single ref and comma lists (`Depends on: #12, #13`).
          # A malformed line (no `#N`) simply yields no deps.
          deps=$(printf '%s\n' "$body" \
            | grep -ioE '^[[:space:]]*\*{0,2}Depends on:\*{0,2}[[:space:]]*#[0-9][0-9, #]*' \
            | grep -oE '#[0-9]+' | tr -d '#' | sort -u || true)

          blocker=""
          for dep in $deps; do
            state=$(gh issue view "$dep" --json state --jq '.state' 2>/dev/null || echo "")
            if [ "$state" = "OPEN" ]; then
              blocker="$dep"
              break
            fi
          done

          if [ -n "$blocker" ]; then
            echo "#${ISSUE} blocked on open dependency #${blocker}"
            echo "#${ISSUE} blocked on open dependency #${blocker}" >> "$summary"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  implement:
    needs: dedup
    if: needs.dedup.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # Plain-text prompts get NO tools by default in automation mode.
          claude_args: >-
            --max-turns 40
            --model claude-sonnet-5
            --allowedTools "Bash,Edit,MultiEdit,Write,Read,Glob,Grep,TodoWrite"
          prompt: |
            Implement GitHub issue #${{ github.event.issue.number || github.event.inputs.issue }}
            in this repository (brewski-beers/techbybrewski).

            Workflow:
            1. Read the issue with `gh issue view <n>`. If its body has a
               `## ⚠️ Manual Prerequisites` section with any unchecked `- [ ]`,
               stop and comment that manual prerequisites block it. Do not implement.
            2. Read the repo's CLAUDE.md and follow its conventions.
            3. Create a branch `worker/<n>-<short-kebab-slug>` off origin/main.
            4. Make the change. Keep it minimal and focused on the issue.
            5. Run `npm ci`, then `npm run lint` and `npx tsc --noEmit`. Fix
               anything you broke. Do not commit with lint or type errors.
            6. Commit (`feat: <issue title> (closes #<n>)` or the right
               conventional-commit type), push the branch.
            7. Open a **draft** PR with `gh pr create --draft`, base `main`,
               body starting with `Closes #<n>` and a short `## What` /
               `## Notes` summary.
            8. Comment on the issue with the PR link.

            If you cannot complete it, comment on the issue explaining why and
            leave it open. Never push directly to main.
